<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1419">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg">
<link rel="stylesheet" href="css/style.css">
<title>Nhận diện khuôn mặt</title>
</head>
<body>
<div class="wrap">
  <h1>🙂 Nhận diện khuôn mặt</h1>
  <div class="sub">Chạy trên trình duyệt – ảnh không rời khỏi thiết bị (trừ khi bật cảnh báo Telegram).</div>

  <section class="card">
    <div class="stage">
      <video id="v" playsinline muted autoplay></video>
      <canvas id="c"></canvas>
      <div id="status">Đang tải mô hình…</div>
    </div>
    <div class="row">
      <button class="p" id="btnCam" disabled>Bật camera</button>
      <button id="btnFlip" disabled>Đổi camera</button>
      <label class="grow">Độ nghiêm ngặt
        <input type="range" id="th" min="0.35" max="0.7" step="0.01" value="0.5"><span id="thv">0.50</span>
      </label>
      <label class="grow"><input type="checkbox" id="alertOn"> Gửi Telegram khi gặp người lạ (cần server)</label>
    </div>
  </section>

  <section class="card">
    <b>Đăng ký khuôn mặt</b>
    <div class="row">
      <input type="text" id="name" placeholder="Tên người (vd: Thịnh)">
      <button class="p" id="btnSnap" disabled>Chụp từ camera</button>
      <button id="btnUp" disabled>Tải ảnh lên</button>
      <input type="file" id="file" accept="image/*" multiple hidden>
    </div>
    <div class="hint">Nên đăng ký 3–5 ảnh mỗi người (thẳng, nghiêng nhẹ, đủ sáng).</div>
  </section>

  <section class="card">
    <b>Danh sách đã đăng ký</b>
    <div id="list"></div>
    <div class="row">
      <button id="btnExp">Xuất JSON</button>
      <button id="btnImp">Nhập JSON</button>
      <input type="file" id="fimp" accept=".json" hidden>
    </div>
  </section>
  <div class="hint">Chỉ đăng ký và nhận diện người đã đồng ý.</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/dist/face-api.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
